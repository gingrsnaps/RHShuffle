<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Admin Login · RedHunllef</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#05050a" />
  <meta name="color-scheme" content="dark" />
  <link rel="icon" href="{{ url_for('static', filename='redlogo.ico') }}" sizes="any" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body class="admin-page">
  <main class="admin-login-shell">
    <section class="admin-login-card" aria-labelledby="admin-login-title">
      <div class="admin-title">
        <img src="{{ url_for('static', filename='redlogo.png') }}" alt="" />
        <div>
          <p class="admin-kicker">RESTRICTED</p>
          <h1 id="admin-login-title">Admin Login</h1>
        </div>
      </div>

      {% if error %}
        <div class="flash flash-error" role="alert">{{ error }}</div>
      {% endif %}

      <form method="post" action="{{ url_for('admin') }}" autocomplete="on" class="admin-form-stack">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
        <label class="admin-field" for="username">
          <span>Username</span>
          <input id="username" name="username" required autocomplete="username" maxlength="32" />
        </label>
        <label class="admin-field" for="password">
          <span>Password</span>
          <div class="password-wrap"><input id="password" name="password" type="password" required autocomplete="current-password" /><button type="button" class="password-toggle" aria-label="Show password">Show</button></div>
        </label>
        <button class="admin-button btn-green admin-submit" type="submit">Login</button>
      </form>

      <a class="admin-back-link" href="{{ url_for('index') }}">← Return to public leaderboard</a>
    </section>
  </main>
  <script src="{{ url_for('static', filename='admin.js') }}" defer></script>
</body>
</html>
