# Replace the repository name before importing. No database component is needed.
# App Platform local files are temporary; see README for private recovery seeds.
name: redhunllef
region: nyc
features:
  - buildpack-stack=ubuntu-22
services:
  - name: web
    environment_slug: python
    github:
      repo: YOUR_GITHUB_USER/YOUR_PRIVATE_REPOSITORY
      branch: main
      deploy_on_push: false
    source_dir: /
    build_command: python -m pip install -r requirements.txt
    run_command: python wager_backend.py
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      http_path: /healthz
      initial_delay_seconds: 20
      period_seconds: 15
      timeout_seconds: 5
      failure_threshold: 3
    envs:
      - key: APP_ENV
        value: production
        scope: RUN_TIME
      - key: STORAGE_MODE
        value: local
        scope: RUN_TIME
      - key: APP_STATE_KEY
        value: redhunllef
        scope: RUN_TIME
      - key: PORT
        value: "8080"
        scope: RUN_TIME
      - key: SESSION_COOKIE_SECURE
        value: always
        scope: RUN_TIME
      - key: TRUST_APP_PLATFORM
        value: "1"
        scope: RUN_TIME
      - key: SUPERADMIN_USER
        value: gingrsnaps
        scope: RUN_TIME
ingress:
  rules:
    - component:
        name: web
      match:
        path:
          prefix: /
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
